[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracesig"
version = "0.2.1"
description = "Sigma-style detection rules for AI agent tool-call traces: an open rule format, a reference engine, rule packs for Claude Code and agent-policy-gateway."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "Howard Hung-Mo Hsieh", email = "hungmohsieh@gmail.com" }]
keywords = ["ai-security", "llm-security", "detection-engineering", "agent-security", "sigma", "prompt-injection", "claude-code", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "twine"]

[project.scripts]
tracesig = "tracesig.cli:main"

[project.urls]
Homepage = "https://github.com/howardhsieh/tracesig"
Documentation = "https://github.com/howardhsieh/tracesig/tree/main/docs"
Changelog = "https://github.com/howardhsieh/tracesig/blob/main/CHANGELOG.md"
Issues = "https://github.com/howardhsieh/tracesig/issues"

[tool.hatch.build.targets.wheel]
packages = ["tracesig"]

# Ship the bundled rule packs inside the package so `tracesig scan` works
# after `pip install` with no checkout.
[tool.hatch.build.targets.wheel.force-include]
"rules" = "tracesig/rules"

[tool.hatch.build.targets.sdist]
include = ["tracesig", "rules", "examples", "docs", "tests", "README.md", "CHANGELOG.md", "LICENSE"]
