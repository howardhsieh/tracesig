name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Rules validate
        run: tracesig validate

  dogfood:
    name: Rule packs on example traces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Risky traces must trip critical rules (exit 2)
        shell: bash
        run: |
          for trace in examples/indirect_exfil.jsonl examples/claude-code/secret_exfil.jsonl examples/apg/denied-injection.tracesig.jsonl; do
            set +e; tracesig scan "$trace" --fail-on critical > /dev/null; code=$?; set -e
            echo "$trace -> exit $code"
            test "$code" -eq 2
          done
      - name: Benign traces must stay quiet
        shell: bash
        run: |
          tracesig scan examples/benign.jsonl --fail-on medium
          tracesig scan examples/claude-code/benign.jsonl --fail-on low
          tracesig scan examples/apg/benign-session.tracesig.jsonl --fail-on low

  package:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel works without a checkout
        shell: bash
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/tracesig --version
          /tmp/venv/bin/tracesig validate
          /tmp/venv/bin/tracesig rules | tail -1
