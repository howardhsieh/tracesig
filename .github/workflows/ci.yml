name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      - run: pytest -q
      # dogfood: the rule pack must flag the known-bad example and stay quiet on benign
      - run: tracesig scan examples/indirect_exfil.jsonl --rules rules/ --fail-on critical || echo "detections present (expected)"
