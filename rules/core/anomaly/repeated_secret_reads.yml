id: TS-ANO-004
title: Multiple credential/secret reads in a single session (credential harvesting)
status: experimental
severity: medium
category: anomaly
description: >
  Three or more events carrying the `secret` label fire in one session — an
  agent sweeping up `.env` files, SSH keys, cloud credentials and tokens.
  Breadth of credential access on its own is a discovery / credential-access
  signal (MITRE ATT&CK T1552, Unsecured Credentials), even before any data
  leaves the machine; it often precedes an exfiltration sink that TS-EXF-002
  would then catch. Threshold is a starting point; tune per environment.
tags:
  - credential-access
  - secrets
  - discovery
detection:
  frequency:
    labels|contains: secret
    count: 3
