id: TS-INJ-002
title: Tool result solicits credentials or key material
status: experimental
severity: high
category: injection
description: >
  Content returned by a tool asks the agent to reveal or transmit credentials,
  API keys, or environment variables — an injected payload steering the agent
  toward secret disclosure.
tags:
  - prompt-injection
  - secrets
detection:
  selection:
    result_preview|matches: "((send|paste|share|provide|post|include|reveal) (me |us )?(your |the )?(api[_ -]?key|password|token|credentials|secret|ssh key)|print (the )?env|reveal the system prompt|export AWS_)"
