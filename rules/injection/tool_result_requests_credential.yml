id: TS-INJ-002
title: Tool result solicits credentials or key material
status: experimental
severity: high
category: injection
description: >
  Content returned by a tool asks the agent to reveal or transmit credentials,
  API keys, or environment variables — an injected payload steering the agent
  toward secret disclosure.
tags:
  - prompt-injection
  - secrets
detection:
  selection:
    result_preview|matches: "(send (me )?(your )?(api[_ ]?key|password|token|credentials)|print (the )?env|reveal the system prompt|export AWS_)"
