id: TS-PRIV-002
title: Destructive tool used without a prior human-in-the-loop confirmation
status: experimental
severity: medium
category: privilege
description: >
  A destructive/state-changing tool fires in a session that never recorded a
  human_approval / confirm event. Pairs with policy gateways
  (e.g. agent-policy-gateway) that emit an approval event; absence of one
  before a high-impact action is the finding.
tags:
  - human-in-the-loop
  - integrity
detection:
  sequence:
    - tool|matches: "(delete|drop_table|transfer_funds|make_payment|deploy|revoke)"
  # NOTE: refine in v0.2 with a "not preceded by" operator; v0.1 flags all
  # destructive calls so reviewers can confirm an approval exists.
