id: TS-EXF-003
title: Secret-like token embedded in an outbound URL
status: experimental
severity: high
category: exfiltration
description: >
  An outbound network call whose arguments contain a secret-like token
  (API key, bearer token, AWS key id). Exfiltration via URL/query string is a
  common way injected instructions smuggle data out.
tags:
  - data-exfiltration
  - secrets
detection:
  selection:
    tool|matches: "(http_get|http_post|fetch|webhook)"
    args|matches: "(sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|bearer\\s+[A-Za-z0-9._-]{20,}|xox[baprs]-)"
